<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gunea Menua{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1d1d1f;
            margin: 0;
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .menu-container {
            background-color: #f5f5f7;
            padding: 40px 20px;
            width: 260px;
            border-right: 1px solid #d2d2d7;
            box-sizing: border-box;
        }

        .menu-title {
            color: #1d1d1f;
            font-weight: 600;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 25px;
            padding-left: 12px;
            letter-spacing: -0.015em;
        }

        .menu-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .menu-item {
            margin-bottom: 6px;
        }

        .menu-link {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            color: #1d1d1f;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .menu-link:hover {
            background-color: #e8e8ed;
            color: #0066cc;
        }

        .content-container {
            flex-grow: 1;
            padding: 60px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

<nav class="menu-container">
    <h3 class="menu-title">Gunea</h3>
    <ul class="menu-list">
        <li class="menu-item"><a href="{% url 'filmen_zerrenda' %}" class="menu-link">Filmen Zerrenda</a></li>
        <li class="menu-item"><a href="{% url 'filma_bozkatu_ikusi' %}" class="menu-link">Filma Bozkatu</a></li>
        <li class="menu-item"><a href="{% url 'bozkatutako_filmak' %}" class="menu-link">Bozkatutakoak</a></li>
        <li class="menu-item"><a href="{% url 'filma_zaleak' %}" class="menu-link">Zaleak Ikusi</a></li>
        <li class="menu-item">
            <form action="{% url 'logout' %}" method="POST" style="display: inline; width: 100%;">
                {% csrf_token %}
                <button type="submit" class="menu-link" style="background: transparent; border: none; cursor: pointer; text-align: left; font-family: inherit;">
                    Saioa Amaitu
                </button>
            </form>
        </li>
    </ul>
</nav>

<main class="content-container">
    {% block edukiak %}
    {% endblock %}
</main>

</body>
</html>
