<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erregistroa - Filmen gunea</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7; /* Fondo gris muy sutil típico de Apple */
            color: #1d1d1f;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .apple-auth-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
        }

        .apple-auth-title {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: -0.015em;
        }

        /* Estilos automáticos para el formulario as_p de Django */
        .apple-auth-card p {
            margin-bottom: 20px;
            text-align: left;
        }

        .apple-auth-card label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #1d1d1f;
            font-size: 0.95rem;
        }

        .apple-auth-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            background-color: #ffffff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .apple-auth-card input:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        .apple-auth-card .helptext {
            font-size: 0.8rem;
            color: #86868b;
            margin-top: 6px;
            display: block;
        }

        .apple-auth-card ul.errorlist {
            list-style: none;
            padding: 0;
            margin: 6px 0 0 0;
            font-size: 0.85rem;
            color: #ff3b30;
            text-align: left;
        }

        .apple-button {
            width: 100%;
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            font-family: inherit;
            margin-top: 10px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .apple-button:hover {
            background-color: #0077ed;
        }

        .apple-button:active {
            transform: scale(0.98);
        }

        .apple-link {
            display: inline-block;
            margin-top: 25px;
            color: #0071e3;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .apple-link:hover {
            color: #005bb5;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="apple-auth-card">
        <h2 class="apple-auth-title">Erregistroa</h2>

        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" class="apple-button">
                Erregistratu
            </button>
        </form>

        <a href="{% url 'login' %}" class="apple-link">Kontua daukazu? Login</a>
    </div>

</body>
</html>
