{% extends 'filmak/oinarrizkoa.html' %}

{% block title %}Bozka - Filmen gunea{% endblock %}

{% block edukiak %}
<style>
    .apple-title {
        color: #1d1d1f;
        font-weight: 700;
        font-size: 2.5rem;
        margin-top: 0;
        margin-bottom: 30px;
        letter-spacing: -0.015em;
    }

    .apple-select {
        padding: 12px 16px;
        width: 100%;
        max-width: 400px;
        margin-bottom: 24px;
        display: block;
        border: 1px solid #d2d2d7;
        border-radius: 10px;
        background-color: #f5f5f7;
        font-size: 1rem;
        color: #1d1d1f;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .apple-select:focus {
        border-color: #0071e3;
        box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
    }

    .apple-button {
        background-color: #0071e3;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 1rem;
        font-family: inherit;
        transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .apple-button:hover {
        background-color: #0077ed;
    }

    .apple-button:active {
        transform: scale(0.98);
    }

    .apple-alert-error {
        color: #ff3b30;
        background-color: #ffe5e5;
        padding: 14px 18px;
        border-radius: 10px;
        margin-top: 24px;
        font-size: 0.95rem;
        font-weight: 500;
        max-width: 400px;
        box-sizing: border-box;
    }

    .apple-alert-success {
        color: #248a3d;
        background-color: #e6f4ea;
        padding: 14px 18px;
        border-radius: 10px;
        margin-top: 24px;
        font-size: 0.95rem;
        font-weight: 500;
        max-width: 400px;
        box-sizing: border-box;
    }
</style>

<h1 class="apple-title">Bozkatu zure gogoko pelikula</h1>

<form action="" method="POST">
    {% csrf_token %}
    
    <select name="filma_id" class="apple-select">
        {% for filma in filmak %}
            <option value="{{ filma.id }}">{{ filma.izenburua }}</option>
        {% endfor %}
    </select>

    <button type="submit" class="apple-button">
        Bozkatu
    </button>

    {% if error %}
        <div class="apple-alert-error">{{ error }}</div>
    {% endif %}
    
    {% if success %}
        <div class="apple-alert-success">{{ success }}</div>
    {% endif %}
</form>

{% endblock %}
