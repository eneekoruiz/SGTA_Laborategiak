version: "3.9"

services:
  # 1. Base de Datos (Nombre de servicio 'mongo' según sección 7.2)
  mongo:
    image: mongo:latest
    container_name: simhiri_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. IA Zerbitzua (Debe estar en el 5001)
  ai-service:
    build: ./ai-service
    container_name: simhiri_ai
    ports:
      - "5001:8000"  # <--- FUERA: 5001 (Specs), DENTRO: 8000 (Lo que ella tiene)
    env_file: ./ai-service/.env   # Para que lea las claves de GroQ y GitHub del .env

  # 3. Backend (Debe estar en el 5000)
  backend:
    build: ./backend
    container_name: simhiri_backend
    ports:
      - "5000:8000"  # <--- FUERA: 5000 (Specs), DENTRO: 8000 (Su puerto interno)
    depends_on:
      - mongo
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
      - MONGODB_URI=mongodb://mongo:27017/simhiri
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # 4. Frontend (Debe estar en el 3000)
  frontend:
    build: ./frontend
    container_name: simhiri_frontend
    ports:
      - "3001:5173"  # <--- FUERA: 3001, DENTRO: 5173 (Vite dev server)
    depends_on:
      - backend
    env_file: ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"




volumes:
  mongo_data:
    driver: local
